<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejemplo: Sistema de Grid de Bootstrap</title>
<!-- Bootstrap 5 vía CDN: requiere conexión a internet para cargar -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { padding-bottom: 3rem; }
  .caja {
    background: #E4F2F2;
    border: 1px solid #0E7C86;
    border-radius: 6px;
    padding: 1rem;
    text-align: center;
  }
  .caja-oscura {
    background: #16213E;
    color: white;
    border-radius: 6px;
    padding: 1rem;
    text-align: center;
  }
  section { margin-top: 2.5rem; }
  h2 { color: #16213E; }
  code { background: #F7F9FB; padding: 0.15rem 0.4rem; border-radius: 4px; }
</style>
</head>
<body>

  <!-- ============================================
       NAVBAR de Bootstrap (componente preconstruido)
       ============================================ -->
  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#16213E;">
    <div class="container">
      <a class="navbar-brand" href="#">Proyecto</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container">

    <!-- ============================================
         EJEMPLO 1: container > row > col
         12 columnas repartidas 8 / 4 en escritorio,
         apiladas (12/12) en móvil — mobile-first integrado
         ============================================ -->
    <section>
      <h2>1. Grid básico: <code>col-12 col-md-8</code> / <code>col-12 col-md-4</code></h2>
      <div class="row">
        <div class="col-12 col-md-8">
          <div class="caja-oscura">Contenido principal — col-md-8</div>
        </div>
        <div class="col-12 col-md-4">
          <div class="caja">Barra lateral — col-md-4</div>
        </div>
      </div>
    </section>

    <!-- ============================================
         EJEMPLO 2: grilla de tarjetas responsiva
         1 columna en móvil, 2 en tablet, 4 en escritorio
         ============================================ -->
    <section>
      <h2>2. Tarjetas: <code>col-12 col-sm-6 col-lg-3</code></h2>
      <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg-3"><div class="caja">Tarjeta 1</div></div>
        <div class="col-12 col-sm-6 col-lg-3"><div class="caja">Tarjeta 2</div></div>
        <div class="col-12 col-sm-6 col-lg-3"><div class="caja">Tarjeta 3</div></div>
        <div class="col-12 col-sm-6 col-lg-3"><div class="caja">Tarjeta 4</div></div>
      </div>
    </section>

    <!-- ============================================
         EJEMPLO 3: columnas de ancho automático
         Bootstrap reparte el espacio equitativamente
         ============================================ -->
    <section>
      <h2>3. Columnas iguales automáticas: <code>col</code></h2>
      <div class="row g-3">
        <div class="col"><div class="caja">col</div></div>
        <div class="col"><div class="caja">col</div></div>
        <div class="col"><div class="caja">col</div></div>
      </div>
    </section>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
