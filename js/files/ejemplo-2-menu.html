<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ejemplo 2 · Menú interactivo</title>
  <style>
    body {
      font-family: Arial, Calibri, sans-serif;
      background: #FFFFFF;
      color: #16233F;
      margin: 0;
    }
    header {
      background: #16233F;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      color: white;
      font-size: 20px;
      margin: 0;
    }
    #menu-toggle {
      font-size: 20px;
      background: #1F8A8C;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 6px 14px;
      cursor: pointer;
    }
    /* Semana 3: la clase .activo controla la visibilidad */
    .nav-menu {
      display: none;
      flex-direction: column;
      background: #F4F6F9;
      padding: 15px 30px;
    }
    .nav-menu.activo {
      display: flex;
    }
    .nav-menu a {
      color: #16233F;
      text-decoration: none;
      padding: 10px 0;
      border-bottom: 1px solid #DCEFEF;
    }
    .nav-menu a:hover { color: #1F8A8C; }
    .contenido {
      padding: 40px 30px;
      color: #5B6B7C;
    }
    .nota {
      margin-top: 20px;
      font-size: 13px;
      color: #5B6B7C;
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <h1>Mi Proyecto</h1>
    <button id="menu-toggle">☰</button>
  </header>

  <nav class="nav-menu">
    <a href="#">Inicio</a>
    <a href="#">Servicios</a>
    <a href="#">Nosotros</a>
    <a href="#">Contacto</a>
  </nav>

  <div class="contenido">
    <p>Haz clic en el botón ☰ para abrir y cerrar el menú.</p>
    <p class="nota">Abre la consola del navegador (F12 → Console) para ver los mensajes de log.</p>
  </div>

  <script>
    // ---- Selección de elementos del DOM (Semana 4) ----
    const boton = document.querySelector("#menu-toggle");
    const menu = document.querySelector(".nav-menu");

    // ---- Evento + manipulación del DOM ----
    boton.addEventListener("click", () => {
      menu.classList.toggle("activo");

      const abierto = menu.classList.contains("activo");
      boton.textContent = abierto ? "✕" : "☰";
      console.log(abierto ? "Menú abierto" : "Menú cerrado");
    });
  </script>

</body>
</html>
